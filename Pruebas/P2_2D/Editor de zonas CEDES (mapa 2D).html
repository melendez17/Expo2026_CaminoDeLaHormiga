<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Editor de zonas 2D</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--bd:#999;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--fg:#f0f0f0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;font-size:15px}
.t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px}
select,button,input[type=range]{font-size:15px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
#v{overflow:auto;max-height:72vh;margin:0 8px;border:1px solid var(--bd)}
#c{position:relative;width:100%}#c img{width:100%;display:block}
svg{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.p{fill:rgba(255,210,63,.3);stroke:#ff9800;stroke-width:2;vector-effect:non-scaling-stroke}
.q{fill:#fff;stroke:#e65100;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
#h{padding:8px;font-size:14px;opacity:.85}
textarea{width:calc(100% - 16px);margin:0 8px;height:90px;box-sizing:border-box;font:12px monospace;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px}</style></head><body>
<div class="t"><select id="s"></select><button id="u">Rehacer desde cero</button><button id="r">Restaurar zona</button><label>Zoom <input id="z" type="range" min="1" max="4" step="0.25" value="1"></label><button id="e">Copiar todo (JSON)</button></div>
<div id="h">Arrastra un punto para moverlo. Clic cerca del borde agrega un punto; clic lejos lo agrega al final. Doble clic sobre un punto lo borra.</div>
